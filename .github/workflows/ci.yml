name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        # Pinned: an unpinned linter means a new upstream release can fail CI on
        # untouched files. ruff 0.16 started formatting Python blocks inside
        # Markdown, which broke this job on two pre-existing docs files.
        run: pip install ruff==0.16.0

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: CDK synth
        run: cdk synth --all --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
          AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          AWS_DEFAULT_REGION: "us-east-1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install security tools
        run: pip install bandit pip-audit -r requirements.txt

      - name: Bandit — Python security scan
        run: bandit -r stacks/ scripts/ lambda/ -ll -q

      - name: pip-audit — dependency vulnerability scan
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969

      - name: Checkov — IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: cloudformation
          quiet: true
          soft_fail: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        # v3 is a pure Node 20 -> Node 24 runtime bump; no input/output/behavior
        # change. v2 stops working on GitHub-hosted runners after 2026-09-16 when
        # Node 20 is removed. No GITLEAKS_LICENSE needed: this repo is a personal
        # (User) account, not an organization.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
